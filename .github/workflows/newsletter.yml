name: Stryktipset Newsletter

on:
  # Every Friday at 17:00 UTC = 18:00 Stockholm (CET, winter) / 19:00 (CEST, summer),
  # after the Friday press conferences, so the newsletter is in inboxes for Saturday
  # morning. (It used to run Saturday morning to fit API-Football's daily quota;
  # FotMob has no such limit.) Coupon closes Saturday ~15:59.
  # GitHub delays scheduled runs heavily (observed 4–6h late), so backup crons
  # fire later Friday and early Saturday. The already-run guard in main.py makes
  # any run after the first a fast no-op (predictions file for the draw exists),
  # which is also how a manual review run "kills" that week's automatic run.
  schedule:
    - cron: "0 17 * * 5"
    - cron: "0 19 * * 5"
    - cron: "0 21 * * 5"
    - cron: "30 6 * * 6"     # last resort if every Friday run failed

  # Manual trigger — also lets you specify a draw number for testing/backfill
  workflow_dispatch:
    inputs:
      draw_number:
        description: "Draw number to run (leave blank for current week)"
        required: false
        type: string
      dry_run:
        description: "Dry run — generate HTML but don't send email"
        required: false
        type: boolean
        default: false
      force_rerun:
        description: "Re-run even if this draw was already sent (resends as 'uppdaterad')"
        required: false
        type: boolean
        default: false
      review_to:
        description: "Review mode: full run (predictions saved) but email ONLY this address"
        required: false
        type: string
      send_archived:
        description: "Send the reviewed newsletter for this draw to everyone (no new analysis)"
        required: false
        type: boolean
        default: false

# Never run two pipelines at once. Don't cancel in-progress runs — a cancelled
# run could have sent the email without committing predictions.
concurrency:
  group: newsletter
  cancel-in-progress: false

jobs:
  run-newsletter:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to commit prediction data back to repo

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Always check out the latest main (not the SHA at trigger time), so a
          # queued run sees predictions committed by the run before it.
          ref: main
          # Fetch full history so git push works correctly
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Cache pip dependencies — speeds up subsequent runs significantly
      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      # Cache API responses (API-Football, CSV, Sofascore) — avoids re-fetching
      # data that was already retrieved in a previous run (7-day TTL in code)
      - name: Cache API responses
        uses: actions/cache@v4
        with:
          path: data/cache
          key: ${{ runner.os }}-apicache-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-apicache-

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Build the CLI arguments based on inputs
      - name: Build run arguments
        id: args
        run: |
          ARGS="--run"
          if [ "${{ github.event.inputs.send_archived }}" = "true" ]; then
            ARGS="--send-archived"
          elif [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ARGS="--dry-run"
          fi
          if [ "${{ github.event.inputs.force_rerun }}" = "true" ]; then
            ARGS="$ARGS --force"
          fi
          if [ -n "${{ github.event.inputs.draw_number }}" ]; then
            ARGS="$ARGS --draw ${{ github.event.inputs.draw_number }}"
          fi
          echo "cli_args=$ARGS" >> $GITHUB_OUTPUT

      # The review address goes through an env var, never pasted into the shell command
      - name: Run newsletter pipeline
        run: python main.py ${{ steps.args.outputs.cli_args }} ${REVIEW_TO:+--review-to "$REVIEW_TO"}
        env:
          REVIEW_TO: ${{ github.event.inputs.send_archived != 'true' && github.event.inputs.review_to || '' }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          GMAIL_SENDER: ${{ secrets.GMAIL_SENDER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          NEWSLETTER_RECIPIENTS: ${{ secrets.NEWSLETTER_RECIPIENTS }}
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}

      # Upload the dry-run HTML as a downloadable artifact (useful for previewing)
      - name: Upload dry-run HTML
        if: github.event.inputs.dry_run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: newsletter-preview
          path: newsletter_draw_*.html
          retention-days: 7

      # Commit prediction data and performance history back to the repo.
      # This is how we persist our long-term model improvement data.
      # Only runs when not a dry run and there are actual changes to commit.
      - name: Commit prediction data
        if: github.event.inputs.dry_run != 'true'
        run: |
          git config user.name "stryktipset-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/predictions/ data/results/ data/performance/ data/xg/ data/newsletters/
          # Only commit if there are staged changes
          if git diff --staged --quiet; then
            echo "No new prediction data to commit."
            exit 0
          fi
          DRAW_NUM=$(ls -1 data/predictions/draw_*_$(date -u '+%Y-%m-%d').json 2>/dev/null | head -1 | grep -oP 'draw_\K[0-9]+' || echo "unknown")
          git commit -m "data: predictions and newsletter for draw ${DRAW_NUM} ($(date -u '+%Y-%m-%d'))"
          # Rebase onto anything pushed meanwhile (e.g. xG collector) and retry.
          # --autostash: untracked/unstaged pipeline files would otherwise block the rebase.
          for i in 1 2 3; do
            if git pull --rebase --autostash origin main && git push origin HEAD:main; then
              echo "Prediction data pushed."
              exit 0
            fi
            echo "Push attempt $i failed — retrying in 10s"
            sleep 10
          done
          echo "::error::Failed to push prediction data — the next run will NOT see this draw as done and may send a duplicate"
          exit 1

      # Ping Healthchecks.io — if this ping doesn't arrive by the grace deadline,
      # Healthchecks.io emails an alert. Dead man's switch pattern.
      - name: Ping health check (success)
        if: success()
        run: '[ -n "$HC_PING" ] && curl -fsS -m 10 --retry 3 "$HC_PING" || true'
        env:
          HC_PING: ${{ secrets.HC_NEWSLETTER_PING_URL }}

      - name: Ping health check (failure)
        if: failure()
        run: '[ -n "$HC_PING" ] && curl -fsS -m 10 --retry 3 "$HC_PING/fail" || true'
        env:
          HC_PING: ${{ secrets.HC_NEWSLETTER_PING_URL }}
